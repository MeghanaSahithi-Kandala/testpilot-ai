name: TestPilot AI Virtual Sandbox CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 1. Code Quality & Integration Tests
  code-quality:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Integration Suite
        run: |
          python backend/test_app.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  # 2. Docker Sandbox Virtual Testing
  docker-virtual-testing:
    name: Docker Sandbox Virtual Testing
    needs: code-quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Python for test runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Docker Sandbox Containers
        run: |
          docker compose build

      - name: Start Docker Sandbox Services
        run: |
          docker compose up -d

      - name: Wait for Sandbox Services to be Ready
        run: |
          echo "Waiting for TestPilot AI backend to report healthy..."
          timeout 60 bash -c 'until curl -sf http://localhost:8000/api/health > /dev/null; do sleep 2; done'
          echo "✅ Backend is healthy!"

          echo "Waiting for TestPilot AI frontend to report ready..."
          timeout 60 bash -c 'until curl -sf http://localhost:3000/ > /dev/null; do sleep 2; done'
          echo "✅ Frontend UI is ready!"

          echo "Waiting for Mock SUT service to report ready..."
          timeout 30 bash -c 'until curl -sf http://localhost:8080/ > /dev/null; do sleep 2; done'
          echo "✅ Mock System Under Test (SUT) is ready!"

      - name: Execute Virtual Sandbox E2E Testing Suite
        run: |
          python scripts/test_sandbox.py

      - name: Output Container Logs on Failure
        if: failure()
        run: |
          echo "=== Backend Container Logs ==="
          docker logs testpilot-backend
          echo "=== Frontend Container Logs ==="
          docker logs testpilot-frontend
          echo "=== Mock SUT Container Logs ==="
          docker logs testpilot-mock-sut

      - name: Tear Down Sandbox Environment
        if: always()
        run: |
          docker compose down -v
